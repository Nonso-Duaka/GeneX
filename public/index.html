<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GeneX — Cancer Target Mapper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-soft: #1c2129;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #1f6feb;
      --accent-soft: rgba(47, 129, 247, 0.12);
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #131923 0%, var(--bg) 60%);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.25rem;
    }
    .brand svg { width: 38px; height: 38px; }
    h1 {
      margin: 0;
      font-size: 1.85rem;
      letter-spacing: -0.02em;
    }
    h1 .accent { color: var(--accent); }
    p.lead { color: var(--muted); margin: 0 0 1.75rem 0; font-size: 0.95rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: flex-end;
    }
    label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.06em; }
    input[type=text], input[type=number] {
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.8rem;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    input[type=text]:focus, input[type=number]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    input[type=text] { min-width: 280px; flex: 1; }
    input[type=number] { width: 110px; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1.1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.secondary:hover { background: var(--panel-soft); border-color: var(--muted); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel-soft);
    }
    .results-header h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .results-header svg { width: 18px; height: 18px; color: var(--muted); }
    .results-header .count { color: var(--muted); font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      user-select: none;
      transition: color 150ms ease, background-color 150ms ease;
      white-space: nowrap;
    }
    th:hover { color: var(--text); background: var(--panel-soft); }
    th .sort-icon {
      display: inline-block;
      margin-left: 0.35rem;
      opacity: 0.5;
      font-size: 0.7rem;
    }
    th.sorted .sort-icon { opacity: 1; color: var(--accent); }
    tbody tr { transition: background-color 150ms ease; }
    tbody tr:hover { background: var(--panel-soft); }
    tbody tr:last-child td { border-bottom: none; }
    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .results-meta {
      padding: 0.85rem 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .results-meta .matched { color: var(--text); font-weight: 600; }
    .candidates { padding: 0 1.5rem 0.75rem 1.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .pill {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      white-space: nowrap;
    }
    .badge.method-xray { background: rgba(47,129,247,0.12); border-color: rgba(47,129,247,0.4); color: #79b8ff; }
    .badge.method-em { background: rgba(186,113,255,0.12); border-color: rgba(186,113,255,0.4); color: #c8a2ff; }
    .badge.method-nmr { background: rgba(63,185,80,0.12); border-color: rgba(63,185,80,0.4); color: #7ee787; }
    .badge.count { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .badge.phase-approved { background: rgba(63,185,80,0.18); border-color: rgba(63,185,80,0.5); color: #7ee787; }
    .badge.phase-3 { background: rgba(210,153,34,0.15); border-color: rgba(210,153,34,0.5); color: #e3b341; }
    .badge.phase-2, .badge.phase-1 { background: rgba(248,81,73,0.12); border-color: rgba(248,81,73,0.4); color: #ff7b72; }
    .drug-cell { line-height: 1.3; }
    .drug-name { font-weight: 500; }
    .gene-symbol { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; color: var(--accent); }
    .secondary-line { color: var(--muted); font-size: 0.78rem; margin-top: 0.15rem; }
    .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--muted);
    }
    .empty-state svg { width: 48px; height: 48px; opacity: 0.3; margin-bottom: 0.75rem; }
    .empty-state .title { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.25rem; }
    .empty-state .sub { font-size: 0.85rem; }
    .skeleton-row td { padding: 0.85rem 1rem; }
    .skeleton-bar {
      display: block;
      height: 0.85rem;
      border-radius: 4px;
      background: linear-gradient(90deg, #21262d 0%, #2d333b 50%, #21262d 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    #status { color: var(--muted); margin-top: 0.85rem; font-size: 0.88rem; }
    #status.error { color: #ff7b72; }
    code { background: var(--panel-soft); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
    .res-cell { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2f81f7"/>
            <stop offset="1" stop-color="#1f6feb"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="28" stroke="url(#g)" stroke-width="3" fill="none"/>
        <circle cx="32" cy="32" r="6" fill="url(#g)"/>
        <path d="M14 22 C 26 14, 38 50, 50 42" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
        <path d="M14 42 C 26 50, 38 14, 50 22" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
        <line x1="32" y1="2" x2="32" y2="14" stroke="url(#g)" stroke-width="2"/>
        <line x1="32" y1="50" x2="32" y2="62" stroke="url(#g)" stroke-width="2"/>
        <line x1="2" y1="32" x2="14" y2="32" stroke="url(#g)" stroke-width="2"/>
        <line x1="50" y1="32" x2="62" y2="32" stroke="url(#g)" stroke-width="2"/>
      </svg>
      <h1>Gene<span class="accent">X</span></h1>
    </div>
    <div class="panel" style="margin-top: 1.5rem;">
      <form id="search-form">
        <div style="flex: 1; min-width: 260px;">
          <label for="cancer">Cancer type</label>
          <input id="cancer" type="text" placeholder="e.g. lung non-small cell carcinoma" required />
        </div>
        <div>
          <label for="gene-limit">Gene limit</label>
          <input id="gene-limit" type="number" value="15" min="1" max="200" />
        </div>
        <div>
          <label for="structure-limit">Structures / gene</label>
          <input id="structure-limit" type="number" value="5" min="1" max="50" />
        </div>
        <button type="submit" id="submit-btn">Search</button>
      </form>
      <div id="status"></div>
    </div>

    <div id="results-panel" class="panel" style="display: none; padding: 0; overflow: hidden;">
      <div class="results-header">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
          Targets
        </h2>
        <span class="count" id="count-text"></span>
      </div>
      <div id="meta-row" class="results-meta"></div>
      <div id="candidates" class="candidates"></div>
      <div id="results-body"></div>
      <div class="actions" style="padding: 1rem 1.5rem; border-top: 1px solid var(--border); margin-top: 0;">
        <button class="secondary" id="export-json">Export JSON</button>
        <button class="secondary" id="export-csv">Export CSV</button>
      </div>
    </div>
  </div>

<script>
const form = document.getElementById('search-form');
const submitBtn = document.getElementById('submit-btn');
const statusEl = document.getElementById('status');
const resultsPanel = document.getElementById('results-panel');
const metaRow = document.getElementById('meta-row');
const candidatesEl = document.getElementById('candidates');
const resultsBody = document.getElementById('results-body');
const countText = document.getElementById('count-text');

let lastQuery = null;
let currentRows = [];
let sortKey = null;
let sortDir = 1;

const COLUMNS = [
  { key: 'gene',       label: 'Gene' },
  { key: 'protein',    label: 'Protein' },
  { key: 'pdb',        label: 'Best PDB' },
  { key: 'method',     label: 'Method' },
  { key: 'resolution', label: 'Resolution' },
  { key: 'topDrug',    label: 'Top Drug' },
  { key: 'drugCount',  label: 'Drugs' },
];

function buildParams() {
  const cancer = document.getElementById('cancer').value.trim();
  const geneLimit = document.getElementById('gene-limit').value;
  const structureLimit = document.getElementById('structure-limit').value;
  return { cancer, params: new URLSearchParams({ cancer, gene_limit: geneLimit, structure_limit: structureLimit }) };
}

function methodBadge(method) {
  if (!method) return '<span class="badge">—</span>';
  const m = method.toUpperCase();
  let cls = 'badge';
  if (m.includes('X-RAY')) cls += ' method-xray';
  else if (m.includes('ELECTRON')) cls += ' method-em';
  else if (m.includes('NMR')) cls += ' method-nmr';
  return `<span class="${cls}">${method}</span>`;
}

function rowFromTarget(t) {
  return {
    gene: t.gene.symbol,
    geneName: t.gene.name,
    protein: t.protein ? t.protein.uniprot_id : null,
    proteinName: t.protein ? t.protein.name : null,
    pdb: t.best_structure ? t.best_structure.pdb_id : null,
    method: t.best_structure ? t.best_structure.method : null,
    resolution: t.best_structure && t.best_structure.resolution != null ? t.best_structure.resolution : null,
    total: t.structures.length,
    topDrug: t.top_drug ? t.top_drug.name : null,
    topDrugPhase: t.top_drug ? t.top_drug.max_phase : null,
    topDrugLabel: t.top_drug ? t.top_drug.phase_label : null,
    topDrugAction: t.top_drug ? t.top_drug.action_type : null,
    topDrugChembl: t.top_drug ? t.top_drug.chembl_id : null,
    drugCount: (t.drugs || []).length,
    allDrugs: t.drugs || [],
  };
}

function compare(a, b, key) {
  const va = a[key];
  const vb = b[key];
  if (va == null && vb == null) return 0;
  if (va == null) return 1;
  if (vb == null) return -1;
  if (typeof va === 'number' && typeof vb === 'number') return va - vb;
  return String(va).localeCompare(String(vb));
}

function renderTable() {
  const sorted = sortKey
    ? [...currentRows].sort((a, b) => sortDir * compare(a, b, sortKey))
    : currentRows;

  const headerHtml = COLUMNS.map(c => {
    const isSorted = sortKey === c.key;
    const arrow = isSorted ? (sortDir === 1 ? '▲' : '▼') : '↕';
    return `<th data-key="${c.key}" class="${isSorted ? 'sorted' : ''}">${c.label}<span class="sort-icon">${arrow}</span></th>`;
  }).join('');

  const rowsHtml = sorted.map(r => {
    const drugCellMissing = '<span style="color: var(--muted)">—</span>';
    let drugCell = drugCellMissing;
    if (r.topDrug) {
      const phaseClass = r.topDrugPhase === 4 ? 'phase-approved'
        : r.topDrugPhase === 3 ? 'phase-3'
        : 'phase-' + r.topDrugPhase;
      const tooltip = r.allDrugs.slice(0, 8).map(d => `${d.name} (${d.phase_label})`).join(' • ');
      drugCell = `
        <div class="drug-cell" title="${tooltip}">
          <a class="drug-name" href="https://www.ebi.ac.uk/chembl/explore/compound/${r.topDrugChembl}" target="_blank">${r.topDrug}</a>
          <div style="margin-top: 0.2rem;"><span class="badge ${phaseClass}">${r.topDrugLabel}</span>${r.topDrugAction ? ` <span class="secondary-line" style="display:inline">${r.topDrugAction.toLowerCase()}</span>` : ''}</div>
        </div>`;
    }
    const drugCountCell = r.drugCount > 0
      ? `<span class="badge count">${r.drugCount}</span>`
      : drugCellMissing;
    return `
    <tr>
      <td>
        <span class="gene-symbol">${r.gene}</span>
        ${r.geneName ? `<div class="secondary-line">${r.geneName}</div>` : ''}
      </td>
      <td>
        ${r.protein
          ? `<a href="https://www.uniprot.org/uniprotkb/${r.protein}" target="_blank">${r.protein}</a>${r.proteinName ? `<div class="secondary-line">${r.proteinName}</div>` : ''}`
          : '<span style="color: var(--muted)">—</span>'}
      </td>
      <td>${r.pdb ? `<a href="https://www.rcsb.org/structure/${r.pdb}" target="_blank">${r.pdb}</a>` : '<span style="color: var(--muted)">—</span>'}</td>
      <td>${methodBadge(r.method)}</td>
      <td class="res-cell">${r.resolution != null ? r.resolution.toFixed(2) + ' Å' : '<span style="color: var(--muted)">—</span>'}</td>
      <td>${drugCell}</td>
      <td>${drugCountCell}</td>
    </tr>
  `;
  }).join('');

  resultsBody.innerHTML = `<table><thead><tr>${headerHtml}</tr></thead><tbody>${rowsHtml}</tbody></table>`;

  resultsBody.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = 1; }
      renderTable();
    });
  });
}

function renderSkeleton() {
  resultsPanel.style.display = 'block';
  metaRow.innerHTML = '<span class="skeleton-bar" style="width: 60%; height: 1rem;"></span>';
  candidatesEl.innerHTML = '';
  countText.textContent = '';
  let html = '<table><tbody>';
  for (let i = 0; i < 5; i++) {
    html += `<tr class="skeleton-row">`;
    for (let j = 0; j < COLUMNS.length; j++) {
      html += `<td><span class="skeleton-bar" style="width: ${50 + Math.random() * 40}%;"></span></td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  resultsBody.innerHTML = html;
}

function renderEmpty(query) {
  resultsBody.innerHTML = `
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <div class="title">No CIViC match for "${query}"</div>
      <div class="sub">Try a more specific name like "lung non-small cell carcinoma" or "melanoma".</div>
    </div>`;
}

function renderResults(data) {
  resultsPanel.style.display = 'block';
  if (!data.matched_disease) {
    metaRow.innerHTML = `No disease matched <code>${data.cancer_query}</code>.`;
    candidatesEl.innerHTML = '';
    countText.textContent = '';
    renderEmpty(data.cancer_query);
    return;
  }
  metaRow.innerHTML = `Matched <span class="matched">${data.matched_disease}</span>`;
  candidatesEl.innerHTML = data.candidate_diseases
    .filter(c => c !== data.matched_disease)
    .slice(0, 8)
    .map(c => `<span class="pill">${c}</span>`)
    .join('');
  countText.textContent = `${data.results.length} target${data.results.length === 1 ? '' : 's'}`;
  if (data.results.length === 0) {
    resultsBody.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <div class="title">No genes returned for this disease</div>
        <div class="sub">CIViC has the disease but no associated evidence items.</div>
      </div>`;
    return;
  }
  currentRows = data.results.map(rowFromTarget);
  sortKey = null; sortDir = 1;
  renderTable();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const { cancer, params } = buildParams();
  lastQuery = params.toString();
  submitBtn.disabled = true;
  statusEl.classList.remove('error');
  statusEl.textContent = `Searching for "${cancer}"… (first run takes 30–60s; cached after)`;
  renderSkeleton();
  try {
    const resp = await fetch(`/api/search?${params}`);
    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const data = await resp.json();
    statusEl.textContent = '';
    renderResults(data);
  } catch (err) {
    statusEl.classList.add('error');
    statusEl.textContent = `Error: ${err.message}`;
    resultsPanel.style.display = 'none';
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById('export-json').addEventListener('click', () => {
  if (lastQuery) window.location.href = `/api/export?${lastQuery}&format=json`;
});
document.getElementById('export-csv').addEventListener('click', () => {
  if (lastQuery) window.location.href = `/api/export?${lastQuery}&format=csv`;
});
</script>
</body>
</html>
